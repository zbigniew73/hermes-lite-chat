<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hermes-lite-chat</title>
  <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <h1>hermes-lite-chat</h1>
        <div id="model-info">loading model…</div>
        <button id="new-chat">+ New chat</button>
      </header>
      <div id="session-list"></div>
      <footer id="account-box">
        <button id="change-password-btn">Change password</button>
        <form id="change-password-form" hidden>
          <input type="password" id="current-password" placeholder="Current password" autocomplete="current-password" required />
          <input type="password" id="new-password" placeholder="New password" autocomplete="new-password" required />
          <div class="form-actions">
            <button type="submit">Save</button>
            <button type="button" id="cancel-password-btn">Cancel</button>
          </div>
          <div id="change-password-msg"></div>
        </form>
      </footer>
    </aside>
    <main id="terminal-pane">
      <div id="placeholder">Select a session or start a new chat.</div>
      <div id="terminal"></div>
    </main>
  </div>
  <script src="/vendor/xterm/xterm.js"></script>
  <script src="/vendor/xterm/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
